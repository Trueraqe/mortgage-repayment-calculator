<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

<script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { 
          colors: {
            lime: "hsl(61, 70%, 52%)",
            red: "hsl(4, 69%, 50%)",
            slate: {
              100: "hsl(202, 86%, 94%)",
              300: "hsl(203, 41%, 72%)",
              500: "hsl(200, 26%, 54%)",
              700: "hsl(200, 24%, 40%)",
              900: "hsl(202, 55%, 16%)",
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
          font-family: "Plus Jakarta Sans";
          src: url("assets/fonts/PlusJakartaSans-VariableFont_wght.woff2") format("woff2");
          font-weight: 200 800;
          font-display: swap;
        }
    body {
          font-family: "Plus Jakarta Sans", sans-serif;
          font-weight: 400;
        }

        h1 {
          font-weight: 700;
        }
  </style>
  
  <title>Frontend Mentor | Mortgage repayment calculator</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="flex flex-col md:bg-slate-100 items-center justify-center p-5 md:pt-[150px]">

  <div class="bg-white md:rounded-[20px]">

    <div class="grid grid-cols-1 md:grid-cols-[1fr_1fr] max-w-4xl shadow-xl md:rounded-[20px]">
      
      <!-- LEFT COLUMN -->
      <div class="grid bg-white h-full p-8 md:rounded-l-[20px]">
        <div class="flex items-center justify-between">
          <h1 class="text-xl font-bold text-slate-900">Mortgage Calculator</h1>
          <button class="text-md text-slate-700 font-bold underline" type="button" id="clear-button">Clear All</button>
        </div>

          <form>
            <div class="flex flex-col mt-6" id="mortgage-amount-container">
              <label class="text-slate-700 font-bold" for="mortgage-amount">Mortgage Amount</label>
              <div class="group flex overflow-hidden rounded-md border-2 border-slate-500 items-center mt-2 focus-within:border-lime hover:border-lime" id="mortgage-amount-border">
                <span class="bg-slate-300 p-[10px] w-[35px] font-bold text-slate-700 group-focus-within:bg-lime group-focus-within:text-slate-700" id="mortgage-amount-value">£</span><input class="min-w-0 flex-1 p-2 font-bold text-slate-900 outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" type="number" id="mortgage-amount">
              </div>
              <div class="flex flex-col text-red text-sm mt-1 font-bold" id="mortgage-amount-error"></div>
            </div>

            <div class="grid grid-cols-2 gap-9 mt-4">
              <div id="mortgage-term-container">
              <label class="text-slate-700 font-bold" for="mortgage-term">Mortgage Term</label>
                <div class="group flex overflow-hidden rounded-md border-2 border-slate-500 mt-2 focus-within:border-lime hover:border-lime" id="mortgage-term-border">
                  <input class="min-w-0 flex-1 p-2 font-bold text-slate-900 outline-none
                  [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" type="number" id="mortgage-term">
                  <span class="bg-slate-300 p-[10px] font-bold text-slate-700 group-focus-within:bg-lime group-focus-within:text-slate-700" id="mortgage-term-value">years</span>
                </div>
                <div class="flex flex-col text-red text-sm mt-1 font-bold" id="mortgage-term-error"></div>
              </div>

                <div id="interest-rate-container">
                  <label class="text-slate-700 font-bold" for="interest-rate">Interest Rate</label>
                  <div class="group flex overflow-hidden rounded-md border-2 border-slate-500 mt-2 focus-within:border-lime hover:border-lime" id="interest-rate-border">
                    <input class="min-w-0 flex-1 p-2 font-bold text-slate-900 outline-none [appearance:textfield] 
                    [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" type="number" id="interest-rate" step="0.1">
                    <span class="bg-slate-300 p-[10px] font-bold text-slate-700 group-focus-within:bg-lime group-focus-within:text-slate-700" id="interest-rate-value">%</span>
                  </div>
                  <div class="flex flex-col text-red text-sm mt-1 font-bold" id="interest-rate-error"></div>
                </div>
            </div>

          <fieldset class="mt-4">
            <legend class="text-slate-700 font-bold mb-2">Mortgage Type</legend>
            <label class="flex items-center gap-3 border-2 border-slate-500 rounded-md p-2 mb-2 font-bold text-slate-900 cursor-pointer hover:border-lime has-[:checked]:border-lime has-[:checked]:bg-[hsl(61,70%,92%)]">
              <input type="radio" name="mortgage-type" value="repayment"> Repayment
            </label>
            <label class="flex items-center gap-3 border-2 border-slate-500 rounded-md p-2 font-bold text-slate-900 cursor-pointer hover:border-lime has-[:checked]:border-lime has-[:checked]:bg-[hsl(61,70%,92%)]">
              <input type="radio" name="mortgage-type" value="interest-only"> Interest Only
            </label>
          </fieldset>
          <div class="flex flex-col text-red text-sm mt-1 font-bold" id="mortgage-type-error"></div>

          <button class="bg-lime font-bold text-slate-900 rounded-[50px] w-[80%] justify-center items-center gap-2 flex p-4 mt-8" type="button" id="calculate-button"><img class="mr-2" src="assets/images/icon-calculator.svg" alt="icon-calculator">Calculate Repayments</button>
          </form>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="grid bg-slate-900 text-slate-300 h-full p-5 md:rounded-r-[20px] md:rounded-bl-[80px]">
        <div class="flex flex-col items-center justify-center h-full text-center p-5" id="results">
          <img src="assets/images/illustration-empty.svg" alt="illustration-empty" width="150px">
          <h1 class="font-bold text-lg pb-2 text-white">Results shown here</h1>
          <p class="font-bold text-sm text-slate-300">Complete the form and click “calculate repayments” to see what your monthly repayments would be.</p>
        </div>
      </div>
    </div>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Trueraqe">Truerage</a>.
  </footer>

</body>
  <script src="CalculateRepayments.js"></script>
</html>
